name: Build DroidVM ARM64 All Drivers

on:
  workflow_dispatch:
  workflow_call:
  pull_request:

env:
  CONFIG: "Win11 Release"
  PLATFORM: "ARM64"
  OSMASK: "Server10_ARM64"
  CERT_SUBJECT: "CN=DroidVM Test"
  PFX_PW: "droidvm"

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Install WinFsp SDK
        shell: pwsh
        run: |
          $msi = "$env:RUNNER_TEMP\winfsp.msi"
          Invoke-WebRequest -Uri 'https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi' -OutFile $msi -UseBasicParsing
          $p = Start-Process msiexec.exe -ArgumentList '/i',$msi,'/qn','/norestart','ADDLOCAL=ALL' -Wait -PassThru
          Write-Host "msiexec exit: $($p.ExitCode)"
          $inc = 'C:\Program Files (x86)\WinFsp\inc\winfsp\winfsp.h'
          if (-not (Test-Path $inc)) { Write-Host '::warning::WinFsp SDK headers missing; viofs/svc will not build' }

      - name: Install CPDK (Cryptographic Provider Dev Kit)
        shell: pwsh
        run: |
          $hdr = 'C:\Program Files (x86)\Windows Kits\10\Cryptographic Provider Development Kit\Include\bcrypt_provider.h'
          choco install windows-cryptographic-provider-development-kit -y --no-progress 2>&1 | Out-Host
          if (-not (Test-Path $hdr)) {
            $url='https://download.microsoft.com/download/1/7/6/176909B0-50F2-4DF3-B29B-830A17EA7E38/CPDK_RELEASE_UPDATE/cpdksetup.exe'
            Invoke-WebRequest -Uri $url -OutFile cpdksetup.exe
            Start-Process -FilePath .\cpdksetup.exe -ArgumentList '/q','/norestart' -Wait
          }

      - name: Build ARM64 drivers
        shell: pwsh
        run: |
          $epoch = ''
          if ([string]::IsNullOrWhiteSpace($epoch)) {
              $n = '0'
          } else {
              $n = (& git rev-list --count "$epoch..HEAD" | Out-String).Trim()
              if (-not ($n -match '^[0-9]+$')) { $n = '0' }
          }
          $minor = 58000 + [int]$n
          if ($minor -gt 65535) { $minor = 65535 }
          Write-Host "Driver version = 100.6.101.$minor"

          $common = @('/m','/p:ApiValidator_Enable=false','/p:SpectreMitigation=false','/p:SignMode=Off', "/p:_BUILD_MINOR_VERSION_=$minor")

          $jobs = @(
            @{ p='NetKVM/Mof/Mof.vcxproj';                        c='Header';          plat='x64'   ; dep=$true },
            @{ p='VirtIO/VirtioLib.vcxproj';                      c='Win11 Release'; plat='ARM64' ; dep=$true },
            @{ p='VirtIO/WDF/VirtioLib-WDF.vcxproj';              c='Win11 Release'; plat='ARM64' ; dep=$true },
            @{ p='NetKVM/CoInstaller/netkvmco-vs2015.vcxproj';    c='Win11 Release'; plat='ARM64' ; dep=$true },
            @{ p='viosock/lib/viosocklib.vcxproj';                c='Win11 Release'; plat='ARM64' ; dep=$true },
            @{ p='viosock/wspsvc/viosockwspsvc.vcxproj';          c='Win11 Release'; plat='ARM64' ; dep=$true },
            @{ p='NetKVM/ProtocolService/ProtocolService.vcxproj'; c='Win11 Release'; plat='ARM64' ; dep=$true },
            @{ p='viorng/cng/um/viorngum.vcxproj';                c='Win11 Release'; plat='ARM64' ; dep=$true },
            @{ p='vioinput/hidpassthrough/hidpassthrough.vcxproj'; c='Win11 Release'; plat='ARM64' ; dep=$true },
            @{ p='vioinput/sys/vioinput.vcxproj';                 c='Win11 Release'; plat='ARM64' },
            @{ p='viostor/viostor.vcxproj';                       c='Win11 Release'; plat='ARM64' },
            @{ p='vioscsi/vioscsi.vcxproj';                       c='Win11 Release'; plat='ARM64' },
            @{ p='vioserial/sys/vioser.vcxproj';                  c='Win11 Release'; plat='ARM64' },
            @{ p='viorng/viorng/viorng.vcxproj';                  c='Win11 Release'; plat='ARM64' },
            @{ p='viosock/sys/viosock.vcxproj';                   c='Win11 Release'; plat='ARM64' },
            @{ p='NetKVM/NetKVM-VS2015.vcxproj';                  c='Win11 Release'; plat='ARM64' },
            @{ p='viosnd/sys/viosnd.vcxproj';                     c='Win11 Release'; plat='ARM64' },
            @{ p='viofs/pci/viofs.vcxproj';                       c='Win11 Release'; plat='ARM64' },
            @{ p='viofs/svc/virtiofs.vcxproj';                    c='Win11 Release'; plat='ARM64' },
            @{ p='rdmapool/rdmapool.vcxproj';                     c='Release';       plat='ARM64' },
            @{ p='pvmpower/pvmpower.vcxproj';                     c='Release';       plat='ARM64' },
            @{ p='Balloon/sys/balloon.vcxproj';                   c='Win11 Release'; plat='ARM64' },
            @{ p='Balloon/app/blnsvr.vcxproj';                    c='Win11 Release'; plat='ARM64' },
            @{ p='fwcfg64/fwcfg.vcxproj';                         c='Win11 Release'; plat='ARM64' },
            @{ p='ivshmem/ivshmem.vcxproj';                       c='Win11 Release'; plat='ARM64' },
            @{ p='viomem/sys/viomem.vcxproj';                     c='Win11 Release'; plat='ARM64' },
            @{ p='viocrypt/sys/viocrypt.vcxproj';                 c='Win11 Release'; plat='ARM64' },
            @{ p='viocrypt/dll/viocrypt-prov.vcxproj';            c='Win11 Release'; plat='ARM64' },
            @{ p='viogpu/viogpudo/viogpudo.vcxproj';              c='Win11 Release'; plat='ARM64' },
            @{ p='viogpu/viogpuap/viogpuap.vcxproj';              c='Win11 Release'; plat='ARM64' },
            @{ p='viogpu/viogpures/viogpures.vcxproj';            c='Win11 Release'; plat='ARM64' },
            @{ p='viogpu/viogpusc/viogpusc.vcxproj';              c='Win11 Release'; plat='ARM64' }
          ]

          $failed = @()
          foreach ($j in $jobs) {
              Write-Host "::group::build $($j.p) [$($j.c)|$($j.plat)]"
              
              # 安全调用，防止 GitHub Actions 解析器向 msbuild 后方注入代码引发括号不匹配
              $msbuildArgs = @($j.p, "/p:Configuration=$($j.c)", "/p:Platform=$($j.plat)") + $common
              & msbuild @msbuildArgs
              
              if ($LASTEXITCODE -ne 0) {
                  $failed += $j.p
              }
              Write-Host "::endgroup::"
          }
          if ($failed.Count -gt 0) {
              Write-Host "::error::Failed: $($failed -join ', ')"
              exit 1
          }

      - name: Sign + package
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.DROIDVM_PFX_BASE64 }}
          PFX_PW_SECRET: ${{ secrets.DROIDVM_PFX_PW }}
        run: |
          $ErrorActionPreference = 'Continue'
          $kitbin = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\10.*" -Directory | Sort Name -Desc | Select -First 1).FullName
          $signtool = Join-Path $kitbin 'x64\signtool.exe'
          $inf2cat  = Join-Path $kitbin 'x86\inf2cat.exe'
          $stampinf = Join-Path $kitbin 'x86\stampinf.exe'

          New-Item -ItemType Directory -Force out | Out-Null
          $pfx = "out\DroidVM_Test.pfx"
          $pfxPw = if ($env:PFX_PW_SECRET) { $env:PFX_PW_SECRET } else { $env:PFX_PW }
          $pw = ConvertTo-SecureString "$pfxPw" -AsPlainText -Force
          
          if ($env:PFX_B64) {
              [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_B64))
              $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw -Exportable
              Export-Certificate -Cert $cert -FilePath "out\DroidVM_Test.cer" | Out-Null
          } else {
              $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "$env:CERT_SUBJECT" -CertStoreLocation Cert:\CurrentUser\My -KeyExportPolicy Exportable -KeyUsage DigitalSignature -NotAfter (Get-Date).AddYears(10)
              Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $pw | Out-Null
              Export-Certificate   -Cert $cert -FilePath "out\DroidVM_Test.cer" | Out-Null
          }

          $drv = @(
            @{ n='viostor';   root='viostor';   bins=@('viostor.sys');   inf='viostor.inf' },
            @{ n='vioscsi';   root='vioscsi';   bins=@('vioscsi.sys');   inf='vioscsi.inf' },
            @{ n='vioserial'; root='vioserial'; bins=@('vioser.sys');    inf='vioser.inf' },
            @{ n='viorng';    root='viorng';    bins=@('viorng.sys','viorngum.dll'); inf='viorng.inf' },
            @{ n='viosock';   root='viosock';   bins=@('viosock.sys','viosocklib.dll','viosockwspsvc.exe'); inf='viosock.inf' },
            @{ n='NetKVM';    root='NetKVM';    bins=@('netkvm.sys','netkvmp.exe'); inf='netkvm.inf' },
            @{ n='vioinput';  root='vioinput';  bins=@('vioinput.sys','viohidkmdf.sys'); inf='vioinput.inf' },
            @{ n='viosnd';    root='viosnd';    bins=@('viosnd.sys');    inf='viosnd.inf' },
            @{ n='viofs';     root='viofs';     bins=@('viofs.sys','virtiofs.exe'); inf='viofs.inf' },
            @{ n='rdmapool';  root='rdmapool';  bins=@('rdmapool.sys'); inf='rdmapool.inf' },
            @{ n='pvmpower';  root='pvmpower';  bins=@('pvmpower.sys'); inf='pvmpower.inf' },
            @{ n='balloon';   root='Balloon';   bins=@('balloon.sys','blnsvr.exe'); inf='balloon.inf' },
            @{ n='fwcfg';     root='fwcfg64';   bins=@('fwcfg.sys'); inf='fwcfg.inf' },
            @{ n='ivshmem';   root='ivshmem';   bins=@('ivshmem.sys'); inf='ivshmem.inf' },
            @{ n='viomem';    root='viomem';    bins=@('viomem.sys'); inf='viomem.inf' },
            @{ n='viocrypt';  root='viocrypt';  bins=@('viocrypt.sys','viocrypt-prov.dll'); inf='viocrypt.inf' },
            @{ n='viogpu';    root='viogpu';    bins=@('viogpudo.sys','viogpuap.dll','viogpures.dll','viogpusc.exe'); inf='viogpudo.inf' }
          )

          function Pick($r,$f) {
              Get-ChildItem $r -Recurse -Filter $f -File -EA SilentlyContinue |
                Where-Object { $_.FullName -match 'ARM64|arm64' } |
                Sort-Object LastWriteTime -Desc | Select-Object -First 1
          }
          function PickInf($r,$f) {
              $found = Pick $r $f
              if ($found) { return $found }
              $found = Get-ChildItem $r -Recurse -Filter $f -File -EA SilentlyContinue | Sort-Object LastWriteTime -Desc | Select-Object -First 1
              if ($found) { return $found }
              $inx = [IO.Path]::ChangeExtension($f,'.inx')
              Get-ChildItem $r -Recurse -Filter $inx -File -EA SilentlyContinue | Sort-Object LastWriteTime -Desc | Select-Object -First 1
          }

          $pkgIncomplete = $false
          foreach ($d in $drv) {
              $dest = "out\drivers\$($d.n)"
              New-Item -ItemType Directory -Force $dest | Out-Null
              $ok = $true
              foreach ($b in $d.bins) {
                  $fileObj = Pick $d.root $b
                  if ($fileObj) { Copy-Item $fileObj.FullName $dest -Force } else { $ok = $false }
              }
              $infFile = PickInf $d.root $d.inf
              if ($infFile) { Copy-Item $infFile.FullName (Join-Path $dest $d.inf) -Force } else { $ok = $false }
              
              if (-not $ok) { $pkgIncomplete = $true; continue }

              $infPath = Join-Path $dest $d.inf
              $raw = Get-Content $infPath -Raw
              $raw = $raw.Replace('_INX_SUBSYS_VENDOR_ID', '1AF4')
                         .Replace('INX_PLATFORM_DRIVERS_DIR', '13')
                         .Replace('INX_BASE_ON_SYSTEM_ROOT_DRIVER_DIR', '%13%')
                         .Replace('INX_COMPANY', 'Red Hat, Inc.')
              Set-Content -LiteralPath $infPath -Value $raw -NoNewline -Encoding utf8

              Get-ChildItem "$dest\*" -Include *.sys,*.dll,*.exe -EA SilentlyContinue |
                ForEach-Object { & $signtool sign /fd SHA256 /f $pfx /p "$pfxPw" $_.FullName }
              & $inf2cat /driver:$dest /os:$env:OSMASK
              Get-ChildItem "$dest\*.cat" -EA SilentlyContinue |
                ForEach-Object { & $signtool sign /fd SHA256 /f $pfx /p "$pfxPw" $_.FullName }
          }

          Copy-Item .install_scripts\INSTALL.cmd, .install_scripts\install-drivers.ps1, .install_scripts\pvmpower-devnode.ps1 out\ -Force
          Remove-Item $pfx -Force
          if ($pkgIncomplete) { exit 1 }

      - name: Upload drivers artifact
        uses: actions/upload-artifact@v4
        with:
          name: droidvm-arm64-drivers
          path: out/**
          if-no-files-found: error
