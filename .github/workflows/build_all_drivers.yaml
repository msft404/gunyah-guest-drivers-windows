name: Build DroidVM ARM64 All Drivers

on:
  workflow_dispatch:
  workflow_call:
  pull_request:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Install WinFsp SDK
        shell: pwsh
        run: |
          $msi = "$env:RUNNER_TEMP\winfsp.msi"
          Invoke-WebRequest -Uri 'https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi' -OutFile $msi -UseBasicParsing
          Start-Process msiexec.exe -ArgumentList '/i',$msi,'/qn','/norestart','ADDLOCAL=ALL' -Wait

      - name: Install CPDK
        shell: pwsh
        run: |
          $hdr = 'C:\Program Files (x86)\Windows Kits\10\Cryptographic Provider Development Kit\Include\bcrypt_provider.h'
          choco install windows-cryptographic-provider-development-kit -y --no-progress 2>&1 | Out-Host
          if (-not (Test-Path $hdr)) {
            $url='https://download.microsoft.com/download/1/7/6/176909B0-50F2-4DF3-B29B-830A17EA7E38/CPDK_RELEASE_UPDATE/cpdksetup.exe'
            Invoke-WebRequest -Uri $url -OutFile cpdksetup.exe
            Start-Process -FilePath .\cpdksetup.exe -ArgumentList '/q','/norestart' -Wait
          }

      - name: Patch WDK Targets to disable ApiValidator
        shell: pwsh
        run: |
          # 寻找并修补 WDK 的 targets 文件，将 ApiValidator 目标置空
          $targetsFiles = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\build\*\WindowsDriver.common.targets" -Recurse -ErrorAction SilentlyContinue
          foreach ($file in $targetsFiles) {
              $content = Get-Content $file.FullName -Raw
              if ($content -match 'ApiValidator') {
                  Write-Host "Patching: $($file.FullName)"
                  # 将 ApiValidator target 的内容替换为空，防止它执行
                  $content = $content -replace '<Target Name="ApiValidator".*?</Target>', '<Target Name="ApiValidator"></Target> mil'
                  Set-Content -LiteralPath $file.FullName -Value $content -Encoding UTF8
              }
          }

      - name: Run native buildAll.bat
        shell: cmd
        run: |
          call build\build.bat virtio-win.sln "Win10 Win11" ARM64
          if errorlevel 1 exit /b 1
          call buildAll.bat
          if errorlevel 1 exit /b 1
        env:
          VIRTIO_WIN_NO_ARM: ""

      - name: Upload drivers artifact
        uses: actions/upload-artifact@v4
        with:
          name: droidvm-arm64-drivers
          path: |
            **/*.sys
            **/*.inf
            **/*.cat
            **/*.dll
            **/*.exe
          if-no-files-found: error
